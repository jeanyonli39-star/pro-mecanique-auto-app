<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon compte - Pro Mécanique Auto</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="vente-box">

    <h1>👤 Mon compte client</h1>

    <hr>

    <h2 id="nomClient">Chargement...</h2>

    <p>
      <strong>Type de compte :</strong>
      <span id="typeCompteClient"></span>
    </p>

    <p>
      <strong>E-mail :</strong>
      <span id="emailClient"></span>
    </p>

    <p>
      <strong>Téléphone :</strong>
      <span id="telephoneClient"></span>
    </p>

    <p>
      <strong>Ville :</strong>
      <span id="villeClient"></span>
    </p>

    <br>

    <button
      id="btnDeconnexion"
      class="btn">
      🚪 Déconnexion
    </button>

    <br><br>

    <button
      id="btnAccueil"
      class="btn">
      🏠 Retour à l'accueil
    </button>

  </div>


  <!-- JavaScript du compte client -->

  <script
    type="module"
    src="client.js">
  </script>

</body>

</html>
